<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>티어메이커</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section id="board" class="board" aria-label="티어표"></section>

    <section class="pool-wrap">
      <div class="pool-head">
        <h2>대기 칸</h2>
        <span class="hint">이미지를 끌어서 티어에 놓으세요 · 파일을 이 창에 끌어다 놓거나 Ctrl+V로 붙여넣어도 돼요</span>
      </div>
      <div id="pool" class="pool items" data-zone="pool"></div>
    </section>

    <div class="actions">
      <button id="btn-add-images" class="btn primary" type="button">이미지 추가</button>
      <button id="btn-save-png" class="btn" type="button">PNG로 저장</button>
      <div class="menu-wrap">
        <button id="btn-more" class="btn icon" type="button" aria-label="더보기" aria-haspopup="true">⋯</button>
        <div id="more-menu" class="menu" hidden>
          <button type="button" data-action="export">파일로 내보내기</button>
          <button type="button" data-action="import">파일 불러오기</button>
          <button type="button" data-action="reset" class="danger">처음부터 다시</button>
        </div>
      </div>
    </div>
  </main>

  <div id="trash" class="trash" hidden>🗑 여기에 놓으면 삭제</div>

  <div id="tier-popover" class="popover" hidden role="dialog" aria-label="티어 색상">
    <strong id="pop-title" class="pop-title"></strong>
    <span class="pop-label">색상</span>
    <div id="pop-swatches" class="swatches"></div>
    <label class="custom-color">
      <input type="color" id="pop-color">
      <span>원하는 색 직접 고르기</span>
    </label>
    <div class="pop-buttons">
      <button type="button" data-act="clear">이 줄의 이미지를 대기 칸으로</button>
    </div>
  </div>

  <input type="file" id="file-images" accept="image/*" multiple hidden>
  <input type="file" id="file-import" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
