<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>티어메이커</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section id="board" class="board" aria-label="티어표"></section>

    <section class="pool-wrap" aria-label="대기 칸">
      <div id="pool" class="pool items" data-zone="pool"></div>
    </section>

    <div class="actions">
      <button id="btn-add-images" class="btn" type="button">이미지 추가</button>
      <button id="btn-save-png" class="btn" type="button">PNG로 저장</button>
      <div class="menu-wrap">
        <button id="btn-more" class="btn icon" type="button" aria-label="더보기" aria-haspopup="true">⋯</button>
        <div id="more-menu" class="menu" hidden>
          <button type="button" data-action="export">파일로 내보내기</button>
          <button type="button" data-action="import">파일 불러오기</button>
          <button type="button" data-action="reset" class="danger">처음부터 다시</button>
        </div>
      </div>
    </div>
  </main>

  <input type="file" id="file-images" accept="image/*" multiple hidden>
  <input type="file" id="file-import" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <img id="cursor-buddy" class="cursor-buddy" src="assets/cursor-buddy.png" alt="" aria-hidden="true">

  <script src="app.js"></script>
</body>
</html>
